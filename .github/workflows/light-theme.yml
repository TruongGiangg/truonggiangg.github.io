name: Apply light portfolio theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply light technical theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('content="#0b1017"', 'content="#f4f6f5"', 1)
          css = r'''
          /* Light technical theme */
          :root {
            --bg:#f4f6f5; --panel:#ffffff; --line:#d9e0e4; --line-soft:#e7ecef;
            --text:#18212b; --muted:#66717d; --muted-2:#7c8791;
            --accent:#1687a8; --accent-soft:rgba(22,135,168,.08);
            --ok:#3d9b70; --danger:#c95d5d; --radius:12px;
          }
          body {
            color:var(--text);
            background:linear-gradient(rgba(244,246,245,.92),rgba(244,246,245,.97)),url("background.png") center/cover fixed;
          }
          body::before {
            background-image:linear-gradient(rgba(24,33,43,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(24,33,43,.035) 1px,transparent 1px);
            background-size:28px 28px; mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 88%);
          }
          .panel { background:rgba(255,255,255,.94); border-color:var(--line); box-shadow:0 1px 2px rgba(24,33,43,.025); }
          .profile { box-shadow:0 8px 28px rgba(24,33,43,.035); }
          .avatar { border-color:#d5dde2; background:#eef2f3; }
          .role { color:#3d4a56; }
          .intro { color:#68737d; }
          .divider { background:var(--line-soft); }
          .skill,.social-link,.control-group,.tool-button { border-color:var(--line); background:#f8faf9; color:#40505d; }
          .skill { color:#40505d; }
          .social-link:hover,.tool-button:hover,.tool-button.active { color:#17232d; border-color:#b9cbd3; background:#f1f6f7; }
          .social-link i { color:#77838d; }
          .profile-status { color:#687680; border-top-color:var(--line-soft); }
          .workspace-icon { border-color:#c7dde4; }
          .system-state { color:#65737d; }
          .control-group label { color:#7b858d; }
          select { color:#26333d; }
          select option { background:#fff; color:#18212b; }
          .tool-button { transition:border-color .16s ease,background .16s ease,color .16s ease,transform .16s ease; }
          .tool-button:active { transform:translateY(1px); }
          .tool-button.danger:hover { color:#9b4141; border-color:#e0bcbc; background:#fff7f7; }
          .viewer { background:#eef2f1; border-bottom-color:var(--line); }
          .viewer-hint { border-color:rgba(194,205,210,.92); background:rgba(255,255,255,.90); color:#687680; box-shadow:0 5px 18px rgba(24,33,43,.05); }
          .view-button { border-color:#d0d9de; color:#61717c; background:rgba(255,255,255,.92); }
          .view-button:hover { color:#18212b; border-color:#aebfc7; }
          .hud { background:#f8faf9; }
          .metric { border-right-color:var(--line-soft); }
          .metric-label { color:#7a858e; }
          .metric-value { color:#26333d; }
          .note h3 { color:#26333d; }
          .note p { color:#697680; }
          .footer { color:#849099; }
          @media (max-width:560px) { .metric:nth-child(-n+2) { border-bottom-color:var(--line-soft); } }
          '''
          if '/* Light technical theme */' not in s:
              s = s.replace('</style>', css + '\n  </style>', 1)
          s = s.replace('new THREE.Fog(0x0b121c,12,28)', 'new THREE.Fog(0xe8eeec,12,28)')
          s = s.replace('scene.add(new THREE.HemisphereLight(0xbfd8ea,0x17202d,1.1));', 'scene.add(new THREE.HemisphereLight(0xe9f1f0,0x9aa8a9,1.45));')
          s = s.replace('const rimLight=new THREE.DirectionalLight(0x4bbbd8,.55);', 'const rimLight=new THREE.DirectionalLight(0x76b8c8,.35);')
          s = s.replace('color:0x405165', 'color:0x83949b')
          s = s.replace('color:0x36b5d8', 'color:0x1687a8')
          s = s.replace('color:0x8da0b1', 'color:0x78878b')
          s = s.replace('color:0xa7b6c3', 'color:0x9aa7aa')
          s = s.replace('color:0x778b9e', 'color:0xb2bcba')
          s = s.replace('color:0x324154', 'color:0xaeb9b7')
          s = s.replace('color:0x0d151f', 'color:0xe3e9e7')
          p.write_text(s)
          PY
      - name: Commit theme changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "style: refresh portfolio with light technical UI"
            git push
          fi
